[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-commit"
version = "0.1.0"
description = "Generate git commit messages from staged diffs using local Qwen models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Richard Suwandi" }]
keywords = ["qwen", "git", "commit-message", "conventional-commits", "llm"]
dependencies = []

[project.scripts]
qwen-commit = "qwen_commit.cli:main"

[project.urls]
Homepage = "https://github.com/richardcsuwandi/qwen-commit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
